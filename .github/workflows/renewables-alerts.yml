name: Economic Times energy, infrastructure and policy alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: economic-times-renewables-alerts
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and alert state
        uses: actions/checkout@v6
        with:
          # Resolve the branch when this serialized job starts, rather than
          # reusing an event SHA whose delivery state may already be obsolete.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests before sending alerts
        run: python -m pytest -q

      - name: Configure state commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recover previous delivery checkpoint before sending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m solar_alerts.recovery state.json

      - name: Poll, summarize, and email new stories
        id: poll
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          OPENAI_REASONING_EFFORT: medium
          SOURCE_PAGE_URL: https://economictimes.indiatimes.com/industry/renewables/solar-energy
          SOURCE_POWER_PAGE_URL: https://economictimes.indiatimes.com/industry/energy/power
          SOURCE_RENEWABLES_PAGE_URL: https://economictimes.indiatimes.com/industry/renewables
          SOURCE_INFRASTRUCTURE_PAGE_URL: https://economictimes.indiatimes.com/news/economy/infrastructure
          SOURCE_POLICY_PAGE_URL: https://economictimes.indiatimes.com/news/economy/policy
          STATE_FILE: state.json
          MAX_STORY_AGE_HOURS: 24
        run: python -m solar_alerts --once

      - name: Persist deduplication state
        id: persist
        if: ${{ always() }}
        run: |
          if [ ! -f state.json ]; then
            exit 0
          fi
          python -m solar_alerts.persistence state.json --branch main

      - name: Retain checkpoint if the run fails
        if: ${{ failure() && steps.persist.outcome == 'failure' && (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: alert-state-checkpoint
          path: state.json
          retention-days: 7
